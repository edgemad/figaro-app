name: Figaro Installers

on:
  push:
    tags: ['v*']

concurrency:
  group: figaro-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  create-draft-release:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    outputs:
      upload_url: ${{ steps.release.outputs.upload_url }}
    steps:
      - name: Version from tag
        id: ver
        run: |
          V="${GITHUB_REF#refs/tags/v}"
          echo "VERSION=${V:-0.8.6}" >> "$GITHUB_ENV"
      - name: Create draft release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Figaro ${{ env.VERSION }}
          draft: true
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    needs: create-draft-release
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      NODE_OPTIONS: '--max-old-space-size=4196'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Xcode (best effort)
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer || true
      - name: Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.5.3 --activate
          yarn config set -H enableImmutableInstalls false
      - name: Build (universal dmg)
        run: make build
      - name: Package portable zip
        run: |
          cd src-tauri/target/universal-apple-darwin/release/bundle/macos
          zip -r Figaro-${{ env.VERSION }}-mac-universal.zip Figaro.app
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/Figaro-${{ env.VERSION }}-mac-universal.zip

  build-linux:
    needs: create-draft-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      NODE_OPTIONS: '--max-old-space-size=4196'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: System deps
        run: |
          sudo apt update
          sudo apt install -y libglib2.0-dev libatk1.0-dev libpango1.0-dev libgtk-3-dev \
            libsoup-3.0-dev libwebkit2gtk-4.1-dev librsvg2-dev libfuse2 libappindicator3-dev
      - name: Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.5.3 --activate
          yarn config set -H enableImmutableInstalls false
      - name: Build (deb + AppImage)
        run: make build
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

  build-windows:
    needs: create-draft-release
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      NODE_OPTIONS: '--max-old-space-size=4196'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Yarn
        shell: bash
        run: |
          corepack enable
          corepack prepare yarn@4.5.3 --activate
          yarn config set -H enableImmutableInstalls false
      - name: Build (NSIS installer)
        shell: bash
        run: make build
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            src-tauri/target/release/bundle/nsis/*.exe